<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>使用教程-智能Skill初代机</title>
    <link rel="stylesheet" href="../assets/styles/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    
</head>
<body>
<div id="header-placeholder"></div>
<div class="container" style="display: block;">
    <div class="card">
        <h2>📖 三步上手</h2>
        <div class="swiper" style="border-radius: 16px; overflow: hidden;">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <p>1️⃣ 在聊天框输入 “5分钟后提醒我喝水”</p>
                    <img src="../public/images/guide.png" alt="步骤1">
                </div>
                <div class="swiper-slide">
                    <p>2️⃣ 机器人自动保存，右侧显示倒计时</p>
                    <img src="../public/images/guide2.png" alt="步骤2">
                </div>
                <div class="swiper-slide">
                    <p>3️⃣ 到点弹出浏览器通知+页面弹窗</p>
                    <img src="../public/images/guide3.png" alt="步骤3">
                </div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
        <div id="quoteBox">
            <p>✨ 每日一言：加载中...</p>
        </div>
    </div>
</div>
<div id="footer-placeholder"></div>

<script>
    // 确保页眉页脚渲染
    document.getElementById('header-placeholder').innerHTML = window.renderHeader('guide');
    document.getElementById('footer-placeholder').innerHTML = window.renderFooter();

    // 等待 DOM 完全加载后再初始化 Swiper
    document.addEventListener('DOMContentLoaded', function() {
        new Swiper('.swiper', {
            loop: true,
            pagination: { el: '.swiper-pagination', clickable: true },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            autoplay: false   // 如需自动播放可改为 true
        });
    });

    // 异步获取名言
    fetch('https://api.adviceslip.com/advice')
        .then(res => res.json())
        .then(data => {
            document.getElementById('quoteBox').innerHTML = `<p>✨ 今日智慧：${data.slip.advice}</p>`;
        })
        .catch(() => {
            document.getElementById('quoteBox').innerHTML = '<p>💡 自律即自由，坚持定时提醒。</p>';
        });
</script>
</body>
</html>
